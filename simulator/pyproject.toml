[project]
name = "ai-trader-sim"
version = "0.1.0"
description = "Independent market simulator and evaluator for the AI Trader project (Zetaris / Meterless / Nemotron)."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6",
    "httpx>=0.27",
    "fastapi[standard]>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
zetaris = ["jaydebeapi>=1.2", "jpype1>=1.5", "python-dotenv>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["contracts", "sim", "sim.data", "agent", "server"]
